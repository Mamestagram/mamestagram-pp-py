# This file is part of the Cargo package manager for Rust. It defines the metadata and dependencies for a Rust project..
[package]
name = "mames-pp-py"
version = "2.0.1"
edition = "2021"
authors = ["Max Ohn <ohn.m@hotmail.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mamestagram/mamestagram-pp-py"
description = "Difficulty and performance calculation for osu!"

[lib]
name = "mames_pp_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "macros"] }
rosu-mods = { version = "0.3.0", default-features = false, features = ["serde"] }
mames-pp = { git = "https://github.com/Mamestagram/mamestagram-pp-rs", rev = "11f4c0443f8dd777a356cad1d06e675971ec0a4e", features = ["sync"] }
serde = { version = "1.0.203" }

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
